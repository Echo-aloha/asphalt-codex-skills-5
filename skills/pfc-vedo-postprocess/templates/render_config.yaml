input_glob: "pfc_step*.npz"
output_dir: "figures"
resolution: [2400, 1800]
background: "white"
viewup: "z"
camera:
  pos: [0.3, -0.3, 0.3]
  focal_point: [0.0, 0.0, 0.0]
  viewup: [0.0, 0.0, 1.0]
particles:
  sphere_resolution: 12
  colormap: "viridis"
force_chains:
  compression_positive: true
  compression_color: "tomato"
  tension_color: "royalblue"
animation:
  fps: 20
  backend: "ffmpeg"
